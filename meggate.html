<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Meggate – Music Box</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap');
    html,body{margin:0;height:100%;background:#f1f1f1;font-family:Quicksand,system-ui,sans-serif;overflow:hidden}
    #ring{position:absolute;inset:0;margin:auto;width:min(88vmin,96vw);aspect-ratio:1/1;border-radius:50%;pointer-events:none}
    #megImg{position:absolute;width:min(44vmin,360px);user-select:none;-webkit-user-drag:none;touch-action:none;z-index:5;filter:drop-shadow(0 6px 14px rgba(0,0,0,.15))}
    #controls{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;background:rgba(255,255,255,.88);border:1px solid #d3d3d3;border-radius:16px;padding:.5rem .75rem;box-shadow:0 6px 20px rgba(0,0,0,.08)}
    button{border:1px solid #bbb;border-radius:999px;padding:.45rem .9rem;background:white;cursor:pointer;font-weight:600;font-family:inherit}
    button.active{background:#222;color:white;border-color:#222}
    #hud{position:fixed;top:10px;left:50%;transform:translateX(-50%);font-size:.95rem;color:#333;opacity:.88;background:rgba(255,255,255,.85);border:1px solid #d3d3d3;padding:.25rem .6rem;border-radius:10px}
  </style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.39/Tone.js"></script>
<div id="ring"></div>
<img id="megImg" src="media/themeg.png" draggable="false">
<div id="controls">
  <button data-seq="1" class="active">Sequence 1</button>
  <button data-seq="2">Sequence 2</button>
  <button data-seq="3">Sequence 3</button>
  <button id="mute">Mute</button>
</div>
<div id="hud">Spin to play • BPM: <span id="bpmOut">90</span></div>
<script>
const reverb=new Tone.Reverb({decay:1,wet:.5}).toDestination()
const filter=new Tone.Filter(900,"bandpass").connect(reverb)
const delay=new Tone.FeedbackDelay(0, 0.5).connect(filter)
const synth=new Tone.Synth({oscillator:{type:"triangle"},envelope:{attack:.01,decay:.08,sustain:0,release:.01}}).connect(delay)
const SEQS={1:["G3","G3",null,"C4","C4", null, null, null,"D4","D4", null,"E4","E4", null, null, null,
  "G3","G3",null,"B3",null,"B3", "C4", null, null, "C4",null,"D4", "D4", null, null, null,
  "C4","F4",null,"E4","D4",null, null, null, "C4","F4",null,"E4","D4",null, null, "C4", null, "A3", null, null, null, null, null, null
],
            2:["C4","D4","E4","G4",["E4","D4","C4"],"G3"],
            3:[["C5","A4"],["G4","E4"],"D4",["E4","G4"],"A4","G4"]
          }
function revPattern(p){return p.slice().reverse().map(s=>Array.isArray(s)?s.slice().reverse():s)}
let seqFwd,seqRev,cur=1
function buildSequences(notes){
  if(seqFwd){seqFwd.dispose();seqRev.dispose()}
  seqFwd=new Tone.Sequence((t,n)=>(Array.isArray(n)?n:[n]).forEach((x,i)=>synth.triggerAttackRelease(x,.09,t+i*.06)),notes,"8n")
  seqRev=new Tone.Sequence((t,n)=>(Array.isArray(n)?n:[n]).reverse().forEach((x,i)=>synth.triggerAttackRelease(x,.09,t+i*.06)),revPattern(notes),"8n")
  seqFwd.loop=seqRev.loop=true;seqFwd.start(0);seqRev.start(0);seqFwd.mute=true;seqRev.mute=true
}
buildSequences(SEQS[cur])
const meg=document.getElementById("megImg"),ring=document.getElementById("ring"),bpmOut=document.getElementById("bpmOut")
let cx,cy,r,lastAng,lastT,drag=false,muted=false,revMode=false
const BASE_BPM=60,MAX_EXTRA=460,SPEED_AT_MAX=3,MIN_SPEED=.15,START_ANGLE=-Math.PI/2
function layout(){const rect=ring.getBoundingClientRect();cx=rect.left+rect.width/2;cy=rect.top+rect.height/2;r = rect.width * 0.4;place(START_ANGLE)}
function place(a){const x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);meg.style.left=x-meg.width/2+"px";meg.style.top=y-meg.height/2+"px";meg.style.transform=`rotate(${a*180/Math.PI+90}deg)`}
function ang(e){const X=e.touches?.[0]?.clientX??e.clientX,Y=e.touches?.[0]?.clientY??e.clientY;return Math.atan2(Y-cy,X-cx)}
async function startAudio(){if(Tone.context.state!=="running")await Tone.start();if(Tone.Transport.state!=="started")Tone.Transport.start()}
function setBPM(sp){const s=Math.min(Math.abs(sp),SPEED_AT_MAX),b=Math.round(BASE_BPM+s/SPEED_AT_MAX*MAX_EXTRA);Tone.Transport.bpm.value=b;bpmOut.textContent=b}
function setDir(rvs){revMode=rvs;if(seqFwd&&seqRev){seqFwd.mute=rvs||muted;seqRev.mute=!rvs||muted}}
function playState(p){if(p){seqFwd.mute=revMode||muted;seqRev.mute=!revMode||muted}else{seqFwd.mute=seqRev.mute=true}}
let stopTimer
function stopSoon(){clearTimeout(stopTimer);stopTimer=setTimeout(()=>playState(false),150)}
meg.onpointerdown=e=>{drag=true;lastAng=ang(e);lastT=e.timeStamp;startAudio();e.preventDefault()}
window.onpointermove=e=>{if(!drag)return;const a=ang(e),t=e.timeStamp;let d=a-lastAng;if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;const sp=d/((t-lastT)/1000);place(a);setBPM(sp);setDir(sp<0);if(Math.abs(sp)>MIN_SPEED)playState(true);stopSoon();lastAng=a;lastT=t;e.preventDefault()}
window.onpointerup=()=>{drag=false;stopSoon()}
document.getElementById("controls").onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.id==="mute"){muted=!muted;synth.volume.value=muted?-60:0;b.textContent=muted?"Unmute":"Mute";playState(true);return}cur=+b.dataset.seq;buildSequences(SEQS[cur]);document.querySelectorAll("#controls button[data-seq]").forEach(x=>x.classList.toggle("active",x===b));playState(true)}
window.onresize=layout;window.onorientationchange=()=>setTimeout(layout,200);if(meg.complete)layout();else meg.onload=layout;Tone.Transport.bpm.value=90;Tone.Transport.start();playState(false)
</script>
</body>
</html>
