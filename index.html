function getRandomInt(min, max) {
  min = Math.ceil(min);
  max = Math.floor(max);
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function getRandomFloat(min, max) {
  return Math.random() * (max - min) + min;
}

function createEmoji() {
  const thankPanner = new Tone.Panner(0).toDestination(); // Start centered

    decay: 0.2,
    sustain: 0.7,
    release: 1.5, // Long, soft tail
  },
  detune: -5, // Subtle richness
}).toDestination();

// Add a filter for warmth
const filter = new Tone.Filter({
  frequency: 800, // Low-pass for a cozy tone
  type: "lowpass",
  rolloff: -12,
  Q: 1,
}).toDestination();
thanksgivingSynth.connect(filter);

// Add reverb for ambience
const reverb = new Tone.Reverb({
  decay: 4,
  wet: 0.4,
}).toDestination();
filter.connect(reverb);
reverb.connect(thankPanner)

  emojiDisplayTime = getRandomInt(200, 1000); // Random time for the emoji to stay
  const randPitch = getRandomFloat(lowP, highP) // Random pitch for the spooky synth

}

thankPanner.pan.value = panValue

function createEmojisWithRandomInterval() {
  if (!isThankActive) return; // Stop if Halloween mode is not active

  const emojiCreationInterval = getRandomInt(500, 2000); // Random interval time

  setTimeout(() => {
    createEmoji(); // Create an emoji
    createEmojisWithRandomInterval(); // Recursively call to create more emojis
 
  }, emojiCreationInterval);
}
